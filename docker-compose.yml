services:
  dbserver:
    image: mysql/mysql-server:5.7
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_DATABASE: microblog
      MYSQL_USER: microblog
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-microblog-dev-pw}
    volumes:
      - dbdata:/var/lib/mysql

  prod:
    build:
      context: .
      dockerfile: docker/Dockerfile_prod
      args:
        APP_VERSION: ${APP_VERSION:-0.0.0-dev}
    image: microblog:prod
    ports:
      - "8000:5000"
    environment:
      SECRET_KEY: ${SECRET_KEY:-change-me}
      DATABASE_URL: mysql+pymysql://microblog:${MYSQL_PASSWORD:-microblog-dev-pw}@dbserver/microblog
    depends_on:
      - dbserver

  test:
    build:
      context: .
      dockerfile: docker/Dockerfile_test
    image: microblog:test
    volumes:
      - ./app:/home/microblog/app
      - ./tests:/home/microblog/tests

volumes:
  dbdata:
